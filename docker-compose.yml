services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./api/src:/app/src
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/tests:/app/tests
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # HuggingFace / sentence-transformers cache — persisted in a named
      # volume so the ~2 GB model is only downloaded on the first run.
      HF_HOME: /model_cache
    volumes:
      - ./api/src:/app/src
      - uploads_data:/app/uploads
      - hf_cache:/model_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m arq src.worker.main.WorkerSettings

  web:
    build: ./web
    env_file: .env
    environment:
      API_URL: ${API_URL:-http://api:8000}
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    ports:
      - "${WEB_PORT_HOST:-3000}:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  uploads_data:
  hf_cache:
