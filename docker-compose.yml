services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-jina}
      JINA_API_KEY: ${JINA_API_KEY}
      JINA_MODEL: ${JINA_MODEL:-jina-embeddings-v3}
      # Shared with worker so the ~2 GB encoder is downloaded only once.
      HF_HOME: /model_cache
    volumes:
      - ./api/src:/app/src
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/tests:/app/tests
      - uploads_data:/app/uploads
      - hf_cache:/model_cache
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # API_RELOAD is empty by default (stable process, warmup works correctly).
    # Set API_RELOAD=--reload in .env only when you need hot-reload during
    # development, accepting that the encoder will reload on every file change.
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 ${API_RELOAD}

  worker:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-jina}
      JINA_API_KEY: ${JINA_API_KEY}
      JINA_MODEL: ${JINA_MODEL:-jina-embeddings-v3}
      # HuggingFace / sentence-transformers cache — persisted in a named
      # volume so the ~2 GB model is only downloaded on the first run.
      HF_HOME: /model_cache
    volumes:
      - ./api/src:/app/src
      - uploads_data:/app/uploads
      - hf_cache:/model_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m arq src.worker.main.WorkerSettings

  ollama:
    image: ollama/ollama
    volumes:
      # Persists downloaded models across container rebuilds (~1 GB for qwen2.5:1.5b).
      # Pull with: docker compose exec ollama ollama pull qwen2.5:1.5b
      - ollama_models:/root/.ollama
    # Port 11434 is intentionally NOT bound to the host — only accessible within
    # the compose network via http://ollama:11434.
    healthcheck:
      # `ollama list` queries the local server via HTTP using the bundled binary
      # — no curl or wget needed. Returns 0 when the server is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./web
    env_file: .env
    environment:
      API_URL: ${API_URL:-http://api:8000}
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    ports:
      - "${WEB_PORT_HOST:-3000}:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  uploads_data:
  hf_cache:
  ollama_models:
